<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Imagem de destaque da Play Store (1024×500). Gerada com o Playwright: screenshot desta página. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  .destaque {
    width: 1024px; height: 500px; position: relative; overflow: hidden;
    background: repeating-linear-gradient(90deg, #1f7a34 0 64px, #23863a 64px 128px);
    font-family: 'Barlow Condensed', sans-serif; color: #fff;
    display: flex; align-items: center; gap: 44px; padding: 0 64px; box-sizing: border-box;
  }
  /* linhas do campo */
  .destaque::before { content: ''; position: absolute; inset: 28px; border: 4px solid rgba(255, 255, 255, .35); border-radius: 6px; }
  .destaque::after { content: ''; position: absolute; left: 50%; top: 28px; bottom: 28px; border-left: 4px solid rgba(255, 255, 255, .2); }
  .icone { width: 300px; height: 300px; border-radius: 64px; box-shadow: 0 10px 0 #0b1a2c, 0 18px 40px rgba(0, 0, 0, .35); position: relative; z-index: 1; flex: none; }
  .texto { position: relative; z-index: 1; }
  .nome {
    font-size: 104px; font-weight: 800; line-height: .9; color: #ffd23f; text-transform: uppercase; letter-spacing: 1px;
    text-shadow: 0 6px 0 #0b1a2c;
  }
  .lema {
    margin-top: 18px; display: inline-block; background: #10223a; border: 3px solid #ffd23f; border-radius: 8px;
    padding: 8px 16px; font-size: 38px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  .itens { margin-top: 18px; font-family: 'Barlow', sans-serif; font-size: 27px; font-weight: 700; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
</style>
</head>
<body>
  <div class="destaque">
    <img class="icone" src="../public/icone-512.png" alt="" />
    <div class="texto">
      <div class="nome">Dois ou Dez</div>
      <div class="lema">A pelada organizada</div>
      <div class="itens">Lista de chegada · Rodízio · Placar · Torneios</div>
    </div>
  </div>
</body>
</html>
